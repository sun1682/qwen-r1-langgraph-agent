[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-r1-langgraph-agent"
version = "0.1.0"
description = "A checkpointed LangGraph agent with Qwen tool use and DeepSeek-R1 delegation."
requires-python = ">=3.10"
dependencies = [
  "langgraph>=0.2.60,<1.0",
  "langgraph-checkpoint-sqlite>=2.0,<4.0",
  "langchain-openai>=0.2.11,<1.0",
  "langchain-core>=0.3.25,<1.0",
  "python-dotenv>=1.0,<2.0",
]

[project.scripts]
agent = "agent.cli:main"

[tool.setuptools.packages.find]
include = ["agent*"]
